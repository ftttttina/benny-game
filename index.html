<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benny's Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; touch-action: none; }
        canvas { display: block; background: #2c3e50; margin: 0 auto; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 18px; pointer-events: none; text-shadow: 2px 2px 4px #000; z-index: 10; display: none; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #startBtn { padding: 15px 40px; font-size: 24px; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.3s; }
        #deathScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 30; }
        #levelUp { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #f1c40f; font-size: 40px; font-weight: bold; display: none; z-index: 15; pointer-events: none; }
    </style>
</head>
<body>

    <div id="ui">Lives: <span id="lives">3</span> | Score: <span id="score">0</span></div>
    <div id="levelUp">SPEED UP!</div>
    
    <div id="overlay">
        <h1 style="color: white; margin-bottom: 20px;">Benny's Game</h1>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="deathScreen"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const deathScreen = document.getElementById('deathScreen');
const levelUpMsg = document.getElementById('levelUp');

// --- 主角圖片設定 ---
const playerImg = new Image();
// 請將下方的網址替換成你的 jpg 檔案路徑，例如 "face.jpg"
playerImg.src = 'https://via.placeholder.com/50/f1c40f/ffffff?text=Benny'; 

let lives, score, gameActive, currentPlatformSpeed;
const gravity = 0.5;
const baseWalkSpeed = 5;
const fallMultiplier = 0.8;
let platforms = [];
let keys = {};
let touchStartX = 0;

const player = {
    x: 0, y: 0, w: 35, h: 35, // 稍微加大一點讓臉看更清楚
    vx: 0, vy: 0, grounded: false
};

function resetGame() {
    lives = 3; score = 0;
    currentPlatformSpeed = 1.8;
    gameActive = true;
    platforms = [];
    
    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
    
    player.x = canvas.width / 2;
    player.y = canvas.height / 2;
    
    // 生成初始平台，使用隨機高度間距
    let currentY = 150;
    while (currentY < canvas.height + 100) {
        spawnPlatform(currentY);
        // 高度隨機：在 100 到 160 像素之間隨機產生下一個平台的高度
        currentY += 100 + Math.random() * 60; 
    }
    
    updateUI();
    ui.style.display = 'block';
    overlay.style.display = 'none';
    deathScreen.style.display = 'none';
    requestAnimationFrame(update);
}

function spawnPlatform(yPos) {
    const minWidth = 70;
    const maxWidth = Math.max(50, 180 - (Math.floor(score/5) * 10)); 
    const pWidth = Math.random() * (maxWidth - minWidth) + minWidth;
    platforms.push({
        x: Math.random() * (canvas.width - pWidth),
        y: yPos || canvas.height + (Math.random() * 50), // 新生成的平台也有隨機 y 偏移
        w: pWidth,
        h: 12
    });
}

function updateUI() {
    document.getElementById('lives').innerText = lives;
    document.getElementById('score').innerText = score;
}

// 控制邏輯
startBtn.addEventListener('click', resetGame);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => {
    const diff = e.touches[0].clientX - touchStartX;
    player.vx = diff > 0 ? baseWalkSpeed : -baseWalkSpeed;
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => player.vx = 0);

function update() {
    if (!gameActive) return;

    let moveSpeed = player.grounded ? baseWalkSpeed : baseWalkSpeed * fallMultiplier;
    if (keys['ArrowLeft']) player.vx = -moveSpeed;
    else if (keys['ArrowRight']) player.vx = moveSpeed;
    else if (!('ontouchstart' in window)) player.vx *= 0.7;

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    player.grounded = false;
    platforms.forEach((p, i) => {
        p.y -= currentPlatformSpeed;

        if (player.vy > 0 && 
            player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.grounded = true;
        }

        if (p.y < -20) {
            platforms.splice(i, 1);
            // 每次上方消失一個，下方補一個，並加入高度隨機性
            const lastP = platforms[platforms.length - 1];
            const nextY = lastP ? lastP.y + 120 + Math.random() * 60 : canvas.height;
            spawnPlatform(nextY);
            score++;
            updateUI();
            if (score % 15 === 0 && score !== 0) {
                currentPlatformSpeed += 0.5;
                showSpeedUpEffect();
            }
        }
    });

    if (player.y <= 20 || player.y > canvas.height) handleLifeLoss();

    draw();
    if (gameActive) requestAnimationFrame(update);
}

function showSpeedUpEffect() {
    levelUpMsg.style.display = 'block';
    setTimeout(() => { levelUpMsg.style.display = 'none'; }, 1000);
}

function handleLifeLoss() {
    lives--;
    updateUI();
    if (lives <= 0) {
        gameActive = false;
        deathScreen.style.display = 'block';
        setTimeout(() => {
            deathScreen.style.display = 'none';
            overlay.style.display = 'flex';
            ui.style.display = 'none';
        }, 1000);
    } else {
        player.y = canvas.height / 2;
        player.vy = 0;
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 頂部尖刺
    ctx.fillStyle = "#e74c3c";
    for(let i=0; i<canvas.width; i+=20) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i+10, 20); ctx.lineTo(i+20, 0);
        ctx.fill();
    }

    // 平台
    ctx.fillStyle = "#ecf0f1";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
    });

    // 繪製主角頭像
    if (playerImg.complete) {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
    } else {
        // 如果圖片還沒載入，先用方塊代替
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }
}
</script>
</body>
</html>
