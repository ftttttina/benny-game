<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benny's Ice World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #051937; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; background: linear-gradient(to bottom, #051937, #004d7a, #008793); margin: 0 auto; }
        
        /* 毛玻璃 UI 樣式 */
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 20px; pointer-events: none; z-index: 10; display: none; }
        .heart { color: #00d2ff; margin-right: 5px; text-shadow: 0 0 8px #fff; }
        
        #overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); /* 毛玻璃核心 */
            -webkit-backdrop-filter: blur(15px);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; 
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 { color: white; font-size: 24px; font-weight: 300; margin-bottom: 20px; letter-spacing: 4px; }
        #startBtn { 
            padding: 10px 30px; font-size: 18px; cursor: pointer; 
            background: rgba(255, 255, 255, 0.2); color: white; 
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 5px; 
            transition: 0.3s; 
        }
        #startBtn:hover { background: rgba(255, 255, 255, 0.3); }
        
        #deathScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 30; }
        #levelUp { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); color: #00d2ff; font-size: 30px; display: none; z-index: 15; pointer-events: none; text-shadow: 0 0 10px white; }
    </style>
</head>
<body>

    <div id="ui">
        <span id="heartContainer"></span>
        <span style="margin-left:15px">Score: <span id="score">0</span></span>
    </div>

    <div id="levelUp">FREEZING FASTER!</div>
    
    <div id="overlay">
        <h1>Benny's Game</h1>
        <button id="startBtn">START</button>
    </div>

    <div id="deathScreen"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const heartContainer = document.getElementById('heartContainer');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const deathScreen = document.getElementById('deathScreen');
const levelUpMsg = document.getElementById('levelUp');

const playerImg = new Image();
playerImg.src = 'your_face.jpg'; 

let lives, score, gameActive, currentPlatformSpeed;
const gravity = 0.5;
const baseWalkSpeed = 5;
const fallMultiplier = 0.8;
let platforms = [];
let icicles = []; // 冰錐陣列
let keys = {};
let touchStartX = 0;

const player = { x: 0, y: 0, w: 35, h: 35, vx: 0, vy: 0, grounded: false };

function resetGame() {
    lives = 3; score = 0;
    currentPlatformSpeed = 1.8;
    gameActive = true;
    platforms = [];
    icicles = [];
    
    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
    
    player.x = canvas.width / 2 - player.w / 2;
    player.y = canvas.height / 2;
    
    // 初始化冰錐
    for(let i=0; i<canvas.width; i+=40) {
        icicles.push({ x: i, y: 0, w: 15, h: 40, isFalling: false, speed: 0 });
    }

    let lastY = 200;
    for(let i=0; i<6; i++) {
        spawnPlatform(lastY);
        lastY += 130 + Math.random() * 60;
    }
    
    updateUI();
    ui.style.display = 'block'; overlay.style.display = 'none'; deathScreen.style.display = 'none';
    requestAnimationFrame(update);
}

function updateUI() {
    document.getElementById('score').innerText = score;
    let heartsHtml = '';
    for(let i=1; i<=3; i++) heartsHtml += `<span class="heart">${i <= lives ? '♥' : '♡'}</span>`;
    heartContainer.innerHTML = heartsHtml;
}

function spawnPlatform(yPos) {
    const minWidth = 70;
    const maxWidth = Math.max(55, 180 - (Math.floor(score/5) * 8)); 
    const pWidth = Math.random() * (maxWidth - minWidth) + minWidth;
    let finalY = yPos;
    if (!finalY && platforms.length > 0) {
        finalY = platforms[platforms.length - 1].y + 130 + Math.random() * 70;
    }
    platforms.push({ x: Math.random() * (canvas.width - pWidth), y: finalY || canvas.height, w: pWidth, h: 12 });
}

startBtn.addEventListener('click', resetGame);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => {
    const diff = e.touches[0].clientX - touchStartX;
    player.vx = diff > 0 ? baseWalkSpeed : -baseWalkSpeed;
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => player.vx = 0);

function update() {
    if (!gameActive) return;

    let moveSpeed = player.grounded ? baseWalkSpeed : baseWalkSpeed * fallMultiplier;
    if (keys['ArrowLeft']) player.vx = -moveSpeed;
    else if (keys['ArrowRight']) player.vx = moveSpeed;
    else if (!('ontouchstart' in window)) player.vx *= 0.7;

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    // 冰錐邏輯
    icicles.forEach(ic => {
        // 隨機觸發掉落
        if (!ic.isFalling && Math.random() < 0.005) {
            ic.isFalling = true;
            ic.speed = 3 + Math.random() * 4;
        }
        if (ic.isFalling) {
            ic.y += ic.speed;
            // 碰撞檢查 (主角被冰錐砸中)
            if (player.x < ic.x + ic.w && player.x + player.w > ic.x &&
                player.y < ic.y + ic.h && player.y + player.h > ic.y) {
                handleLifeLoss();
                resetIcicle(ic);
            }
            // 掉出螢幕重置
            if (ic.y > canvas.height) resetIcicle(ic);
        }
    });

    player.grounded = false;
    platforms.forEach((p, i) => {
        p.y -= currentPlatformSpeed;
        if (player.vy > 0 && player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h; player.vy = 0; player.grounded = true;
        }
        if (p.y < -20) {
            platforms.splice(i, 1); spawnPlatform(); score++; updateUI();
            if (score % 15 === 0 && score !== 0) { currentPlatformSpeed += 0.5; showSpeedUpEffect(); }
        }
    });

    if (player.y <= 40 || player.y > canvas.height) handleLifeLoss();

    draw();
    if (gameActive) requestAnimationFrame(update);
}

function resetIcicle(ic) {
    ic.y = 0;
    ic.isFalling = false;
    ic.speed = 0;
}

function handleLifeLoss() {
    lives--; updateUI();
    if (lives <= 0) {
        gameActive = false;
        deathScreen.style.display = 'block';
        setTimeout(() => { deathScreen.style.display = 'none'; overlay.style.display = 'flex'; ui.style.display = 'none'; }, 1000);
    } else {
        player.y = canvas.height / 2; player.vy = 0;
    }
}

function showSpeedUpEffect() {
    levelUpMsg.style.display = 'block';
    setTimeout(() => { levelUpMsg.style.display = 'none'; }, 1000);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製冰錐 (一根一根的三角形)
    icicles.forEach(ic => {
        ctx.fillStyle = "#a5f2f3";
        ctx.beginPath();
        ctx.moveTo(ic.x, ic.y);
        ctx.lineTo(ic.x + ic.w / 2, ic.y + ic.h);
        ctx.lineTo(ic.x + ic.w, ic.y);
        ctx.fill();
        // 冰錐亮邊
        ctx.strokeStyle = "white";
        ctx.stroke();
    });

    // 繪製冰層平台
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "rgba(0, 210, 255, 0.3)";
        ctx.fillRect(p.x, p.y + 8, p.w, 4); // 平台的冰層厚度感
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    });

    if (playerImg.complete && playerImg.naturalWidth !== 0) {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
    } else {
        ctx.fillStyle = "#f1c40f"; ctx.fillRect(player.x, player.y, player.w, player.h);
    }
}
</script>
</body>
</html>
