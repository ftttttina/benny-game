<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benny's Ice World - Pro</title>
    <style>
        :root {
            --bg-color-top: #051937;
            --bg-color-mid: #004d7a;
            --bg-color-bottom: #008793;
        }
        body { margin: 0; overflow: hidden; background: #051937; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #gameCanvas { 
            display: block; 
            margin: 0 auto;
            background: linear-gradient(to bottom, var(--bg-color-top), var(--bg-color-mid), var(--bg-color-bottom));
            transition: all 2s ease; 
        }
        #ui { position: absolute; top: 15px; left: 15px; display: none; z-index: 10; pointer-events: none; }
        #scoreDisplay { color: white; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 3px #000; margin-bottom: 5px; }
        #heartsContainer { display: flex; gap: 5px; }
        
        /* 倒數計時樣式 */
        #countdown { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 80px; font-weight: bold; z-index: 25; display: none;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.8);
        }

        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #cameraContainer { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; margin-bottom: 15px; background: #333; position: relative; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .btn-group { display: flex; gap: 10px; }
        button { padding: 12px 24px; font-size: 14px; cursor: pointer; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; backdrop-filter: blur(10px); transition: 0.3s; }
        #startBtn { background: #22d3ee; color: #051937; font-weight: bold; border: none; }
        #deathScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 30; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreDisplay">Score: <span id="score">0</span></div>
        <div id="heartsContainer"></div>
    </div>

    <div id="countdown">3</div>
    
    <div id="overlay">
        <h2 style="color: white; margin-bottom: 10px; font-weight: 300;">Benny's Ice World</h2>
        <div id="cameraContainer">
            <video id="videoFeed" autoplay playsinline></video>
        </div>
        <div class="btn-group">
            <button id="snapBtn">📸 拍照</button>
            <button id="startBtn">🎮 開始遊戲</button>
        </div>
    </div>

    <canvas id="photoCanvas" width="100" height="100" style="display:none;"></canvas>
    <div id="deathScreen"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const overlay = document.getElementById('overlay');
const video = document.getElementById('videoFeed');
const photoCanvas = document.getElementById('photoCanvas');
const snapBtn = document.getElementById('snapBtn');
const startBtn = document.getElementById('startBtn');
const countdownEl = document.getElementById('countdown');
const heartsContainer = document.getElementById('heartsContainer');

const bgSchemes = [
    { top: '#051937', mid: '#004d7a', bottom: '#008793' },
    { top: '#1a0537', mid: '#4d007a', bottom: '#870093' },
    { top: '#05371a', mid: '#007a4d', bottom: '#009387' }
];

let playerImg = null;
let lives, score, gameActive, currentPlatformSpeed;
let platforms = [], ceilingIcicles = [], snowflakes = [];
let lastDropTime = 0;
const dropInterval = 2000;
const maxLives = 5;

const gravity = 0.5;
const baseWalkSpeed = 5;
const mobileSensitivity = 0.3; // 🚀 調高靈敏度，更跟手
let keys = {};
let touchStartX = 0;

const player = { x: 0, y: 0, w: 40, h: 40, vx: 0, vy: 0, grounded: false };

async function setupCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
    } catch (err) { console.error("相機失敗", err); }
}

snapBtn.addEventListener('click', () => {
    const pCtx = photoCanvas.getContext('2d');
    pCtx.save();
    pCtx.translate(100, 0); pCtx.scale(-1, 1);
    pCtx.drawImage(video, 0, 0, 100, 100);
    pCtx.restore();
    playerImg = new Image();
    playerImg.src = photoCanvas.toDataURL('image/png');
    snapBtn.innerText = "✅ 拍照成功";
});

// 開始倒數邏輯
startBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
    startCountdown();
});

function startCountdown() {
    countdownEl.style.display = 'block';
    let count = 3;
    countdownEl.innerText = count;
    
    const timer = setInterval(() => {
        count--;
        if (count > 0) {
            countdownEl.innerText = count;
            // 簡單的縮放動畫效果
            countdownEl.style.transform = 'translate(-50%, -50%) scale(1.2)';
            setTimeout(() => countdownEl.style.transform = 'translate(-50%, -50%) scale(1)', 200);
        } else if (count === 0) {
            countdownEl.innerText = "GO!";
        } else {
            clearInterval(timer);
            countdownEl.style.display = 'none';
            resetGame(); // 倒數結束正式開始
        }
    }, 1000);
}

function resetGame() {
    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
    lives = 5; score = 0; currentPlatformSpeed = 1.7;
    gameActive = true; platforms = []; 
    initCeiling(); initSnow();
    player.x = canvas.width/2 - 20; player.y = canvas.height/2;
    player.vy = 0; player.vx = 0;
    for(let i=0; i<6; i++) spawnPlatform(canvas.height/6*i + 250);
    updateHeartsUI();
    ui.style.display = 'block';
    requestAnimationFrame(update);
}

// 觸控優化
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => {
    const touchX = e.touches[0].clientX;
    const diff = (touchX - touchStartX) * mobileSensitivity;
    player.vx = diff; // 直接賦值速度，手感更直接
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => player.vx = 0);

function update() {
    if (!gameActive) return;
    currentPlatformSpeed += 0.0004;

    if (score > 0 && score % 15 === 0) {
        const scheme = bgSchemes[Math.floor(score / 15) % bgSchemes.length];
        document.documentElement.style.setProperty('--bg-color-top', scheme.top);
        document.documentElement.style.setProperty('--bg-color-mid', scheme.mid);
        document.documentElement.style.setProperty('--bg-color-bottom', scheme.bottom);
    }

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    player.grounded = false;
    platforms.forEach((p, i) => {
        p.y -= currentPlatformSpeed;
        if (player.vy > 0 && player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h; player.vy = 0; player.grounded = true;
        }
        if (p.y < -20) { platforms.splice(i, 1); spawnPlatform(); score++; document.getElementById('score').innerText = score; }
    });

    let now = Date.now();
    if (now - lastDropTime > dropInterval) {
        let idx = Math.floor(Math.random() * ceilingIcicles.length);
        if(!ceilingIcicles[idx].isDropping) { ceilingIcicles[idx].isDropping = true; ceilingIcicles[idx].speed = 5 + Math.random()*5; }
        lastDropTime = now;
    }

    ceilingIcicles.forEach((ic) => {
        if(ic.isDropping) {
            ic.y = (ic.y || 0) + ic.speed;
            if (ic.x < player.x + player.w && ic.x + ic.w > player.x && (ic.y || 0) < player.y + player.h && (ic.y || 0) + ic.h > player.y) {
                handleLifeLoss(); ic.isDropping = false; ic.y = 0;
            }
            if ((ic.y || 0) > canvas.height) { ic.isDropping = false; ic.y = 0; }
        }
    });

    if (player.y <= 40 || player.y > canvas.height) handleLifeLoss();

    snowflakes.forEach(s => {
        s.y += 0.8 + s.r; s.x += Math.sin(s.d) * 0.5;
        if (s.y > canvas.height) s.y = -10;
    });

    draw();
    if (gameActive) requestAnimationFrame(update);
}

function handleLifeLoss() {
    lives--;
    updateHeartsUI();
    if (lives <= 0) { gameActive = false; location.reload(); }
    else { player.y = canvas.height / 2; player.vy = 0; player.vx = 0; }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 淡色雪花
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    snowflakes.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });

    // 冰塊平台
    platforms.forEach(p => {
        let grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, '#a5f3fc'); grad.addColorStop(1, '#22d3ee');
        ctx.fillStyle = grad; ctx.fillRect(p.x, p.y, p.w, p.h);
    });

    // 立體冰錐
    ceilingIcicles.forEach(ic => {
        let drawY = ic.isDropping ? ic.y : 0;
        let centerX = ic.x + ic.w / 2;
        ctx.fillStyle = `rgba(180, 230, 255, ${ic.opacity})`;
        ctx.beginPath();
        ctx.moveTo(ic.x, drawY); ctx.lineTo(centerX, drawY + ic.h); ctx.lineTo(ic.x + ic.w, drawY); ctx.fill();
        // 側面陰影
        ctx.fillStyle = `rgba(100, 180, 255, ${ic.opacity * 0.4})`;
        ctx.beginPath();
        ctx.moveTo(centerX, drawY); ctx.lineTo(centerX, drawY + ic.h); ctx.lineTo(ic.x + ic.w, drawY); ctx.fill();
    });

    // 主角頭像
    if (playerImg) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x + player.w/2, player.y + player.h/2, player.w/2, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
        ctx.restore();
        ctx.strokeStyle = "white"; ctx.lineWidth = 2; ctx.stroke();
    } else {
        ctx.fillStyle = "#f1c40f"; ctx.fillRect(player.x, player.y, player.w, player.h);
    }
}

function updateHeartsUI() {
    heartsContainer.innerHTML = '';
    for (let i = 0; i < maxLives; i++) {
        const heart = document.createElement('canvas');
        heart.width = 30; heart.height = 30;
        const hCtx = heart.getContext('2d');
        drawHeart(hCtx, 15, 15, 10, i < lives);
        heartsContainer.appendChild(heart);
    }
}

function drawHeart(ctx, x, y, size, isFull) {
    ctx.save(); ctx.translate(x, y - size/4); ctx.beginPath();
    const r = size / 2;
    ctx.arc(-r / 2, 0, r / 2, Math.PI, 0); ctx.arc(r / 2, 0, r / 2, Math.PI, 0); ctx.lineTo(0, r * 1.2); ctx.closePath();
    if (isFull) { ctx.fillStyle = "#FF4D4D"; ctx.fill(); }
    else { ctx.strokeStyle = "rgba(255, 255, 255, 0.6)"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore();
}

function spawnPlatform(yPos) {
    const pWidth = 80 + Math.random() * 80;
    platforms.push({ x: Math.random()*(canvas.width - pWidth), y: yPos || canvas.height, w: pWidth, h: 15 });
}

function initCeiling() {
    ceilingIcicles = [];
    for(let i=0; i<canvas.width; i+=25) {
        ceilingIcicles.push({ x: i, w: 15+Math.random()*15, h: 25+Math.random()*45, isDropping: false, speed: 0, opacity: 0.5+Math.random()*0.4 });
    }
}

function initSnow() {
    snowflakes = [];
    for(let i=0; i<60; i++) snowflakes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.5, d: Math.random()*1 });
}

setupCamera();
</script>
</body>
</html>
