<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benny's Snowman World - Apple Power</title>
    <style>
        :root {
            --bg-color-top: #051937;
            --bg-color-mid: #004d7a;
            --bg-color-bottom: #008793;
        }
        body { margin: 0; overflow: hidden; background: #051937; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        #gameCanvas { 
            display: block; 
            margin: 0 auto;
            background: linear-gradient(to bottom, var(--bg-color-top), var(--bg-color-mid), var(--bg-color-bottom));
            transition: all 2s ease; 
        }
        #ui { position: absolute; top: 15px; left: 15px; display: none; z-index: 10; pointer-events: none; }
        #scoreDisplay { color: white; font-size: 20px; font-weight: bold; text-shadow: 1px 1px 3px #000; margin-bottom: 5px; }
        #heartsContainer { display: flex; gap: 5px; }
        
        /* 🍎 蘋果倒數樣式 */
        #appleTimer { color: #ffd700; font-size: 18px; font-weight: bold; display: none; margin-top: 5px; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }

        #countdown { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: white; font-size: 80px; font-weight: bold; z-index: 25; display: none;
            text-shadow: 0 0 20px rgba(34, 211, 238, 0.8);
        }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #cameraContainer { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 3px solid rgba(255,255,255,0.5); margin-bottom: 20px; background: #333; }
        #videoFeed { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .btn-group { display: flex; flex-direction: column; gap: 15px; width: 200px; }
        button { 
            padding: 14px 20px; font-size: 16px; cursor: pointer; 
            color: white; border-radius: 15px;
            background: rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: 0.3s;
            font-weight: 500;
        }
        #startBtn { background: rgba(34, 211, 238, 0.2); border-color: rgba(34, 211, 238, 0.5); }
    </style>
</head>
<body>

    <div id="ui">
        <div id="scoreDisplay">Score: <span id="score">0</span></div>
        <div id="heartsContainer"></div>
        <div id="appleTimer">🛡️ Shield: <span id="shieldSeconds">10</span>s</div>
    </div>
    <div id="countdown">3</div>
    <div id="overlay">
        <h2 style="color: white; margin-bottom: 20px; font-weight: 300;">ICE WORLD</h2>
        <div id="cameraContainer"><video id="videoFeed" autoplay playsinline></video></div>
        <div class="btn-group">
            <button id="snapBtn">📸 Take a Pic</button>
            <button id="startBtn">🎮 Start Game</button>
        </div>
    </div>
    <canvas id="photoCanvas" width="100" height="100" style="display:none;"></canvas>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const overlay = document.getElementById('overlay');
const video = document.getElementById('videoFeed');
const photoCanvas = document.getElementById('photoCanvas');
const snapBtn = document.getElementById('snapBtn');
const startBtn = document.getElementById('startBtn');
const countdownEl = document.getElementById('countdown');
const heartsContainer = document.getElementById('heartsContainer');
const appleTimerEl = document.getElementById('appleTimer');
const shieldSecondsEl = document.getElementById('shieldSeconds');

// 音效
const dropSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2004/2004-preview.mp3'); 
const hitSound = new Audio('https://assets.mixkit.co/active_storage/sfx/2012/2012-preview.mp3');
const powerUpSound = new Audio('https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3'); // 獎勵音效

const bgSchemes = [
    { top: '#051937', mid: '#004d7a', bottom: '#008793' },
    { top: '#1a0537', mid: '#4d007a', bottom: '#870093' },
    { top: '#05371a', mid: '#007a4d', bottom: '#009387' }
];

let playerImg = null, lives, score, gameActive, currentPlatformSpeed;
let platforms = [], ceilingIcicles = [], snowflakes = [], apples = [], lastDropTime = 0;
let shieldTime = 0; // 🛡️ 剩餘保護時間
const dropInterval = 2000, maxLives = 5, gravity = 0.5, baseWalkSpeed = 6;
const mobileSensitivity = 0.15; 
let keys = {}, touchStartX = 0;

const player = { x: 0, y: 0, w: 40, h: 65, vx: 0, vy: 0 };

async function setupCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
    } catch (err) { console.error("相機失敗", err); }
}

snapBtn.addEventListener('click', () => {
    const pCtx = photoCanvas.getContext('2d');
    pCtx.save(); pCtx.translate(100, 0); pCtx.scale(-1, 1);
    pCtx.drawImage(video, 0, 0, 100, 100); pCtx.restore();
    playerImg = new Image();
    playerImg.src = photoCanvas.toDataURL('image/png');
    snapBtn.innerText = "✅ Ready!";
});

startBtn.addEventListener('click', () => {
    dropSound.play().then(() => { dropSound.pause(); });
    hitSound.play().then(() => { hitSound.pause(); });
    powerUpSound.play().then(() => { powerUpSound.pause(); });
    overlay.style.display = 'none';
    startCountdown();
});

function startCountdown() {
    countdownEl.style.display = 'block';
    let count = 3;
    countdownEl.innerText = count;
    const timer = setInterval(() => {
        count--;
        if (count > 0) countdownEl.innerText = count;
        else if (count === 0) countdownEl.innerText = "GO!";
        else { clearInterval(timer); countdownEl.style.display = 'none'; resetGame(); }
    }, 1000);
}

function resetGame() {
    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
    lives = 5; score = 0; currentPlatformSpeed = 1.7; shieldTime = 0;
    gameActive = true; platforms = []; apples = [];
    initCeiling(); initSnow();
    player.x = canvas.width/2 - 20; player.y = canvas.height/2;
    player.vy = 0; player.vx = 0;
    for(let i=0; i<6; i++) spawnPlatform(canvas.height/6*i + 250);
    updateHeartsUI();
    ui.style.display = 'block';
    requestAnimationFrame(update);
}

window.addEventListener('keydown', e => { keys[e.code] = true; });
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => {
    player.vx = (e.touches[0].clientX - touchStartX) * mobileSensitivity;
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => { if (!Object.values(keys).includes(true)) player.vx = 0; });

function update() {
    if (!gameActive) return;
    currentPlatformSpeed += 0.0004;

    // 🛡️ 保護時間邏輯
    if (shieldTime > 0) {
        shieldTime -= 1/60; // 每一幀減少時間 (約 60fps)
        appleTimerEl.style.display = 'block';
        shieldSecondsEl.innerText = Math.ceil(shieldTime);
    } else {
        appleTimerEl.style.display = 'none';
    }

    if (score > 0 && score % 15 === 0) {
        const scheme = bgSchemes[Math.floor(score / 15) % bgSchemes.length];
        document.documentElement.style.setProperty('--bg-color-top', scheme.top);
        document.documentElement.style.setProperty('--bg-color-mid', scheme.mid);
        document.documentElement.style.setProperty('--bg-color-bottom', scheme.bottom);
    }

    if (keys['ArrowLeft']) player.vx = -baseWalkSpeed;
    else if (keys['ArrowRight']) player.vx = baseWalkSpeed;
    else if (!('ontouchstart' in window)) player.vx *= 0.85;

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    platforms.forEach((p, i) => {
        p.y -= currentPlatformSpeed;
        if (player.vy > 0 && player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h; player.vy = 0;
        }
        if (p.y < -20) { platforms.splice(i, 1); spawnPlatform(); score++; document.getElementById('score').innerText = score; }
    });

    // 🍎 蘋果邏輯
    apples.forEach((a, i) => {
        a.y -= currentPlatformSpeed;
        // 碰撞檢測
        if (player.x < a.x + 20 && player.x + player.w > a.x && player.y < a.y + 20 && player.y + player.h > a.y) {
            shieldTime = 10;
            powerUpSound.currentTime = 0; powerUpSound.play().catch(()=>{});
            apples.splice(i, 1);
        }
        if (a.y < -20) apples.splice(i, 1);
    });

    let now = Date.now();
    if (now - lastDropTime > dropInterval) {
        let idx = Math.floor(Math.random() * ceilingIcicles.length);
        if(!ceilingIcicles[idx].isDropping) { 
            ceilingIcicles[idx].isDropping = true; 
            ceilingIcicles[idx].speed = 5 + Math.random()*5; 
            dropSound.currentTime = 0; dropSound.play().catch(() => {});
        }
        lastDropTime = now;
    }

    ceilingIcicles.forEach((ic) => {
        if(ic.isDropping) {
            ic.y = (ic.y || 0) + ic.speed;
            if (ic.x < player.x + player.w && ic.x + ic.w > player.x && (ic.y || 0) < player.y + player.h && (ic.y || 0) + ic.h > player.y) {
                if (shieldTime > 0) {
                    // 🛡️ 有盾牌，冰錐碎掉
                    ic.isDropping = false; ic.y = 0;
                } else {
                    handleLifeLoss(); ic.isDropping = false; ic.y = 0;
                }
            }
            if ((ic.y || 0) > canvas.height) { ic.isDropping = false; ic.y = 0; }
        }
    });

    if (player.y <= 40 || player.y > canvas.height) handleLifeLoss();

    snowflakes.forEach(s => {
        s.y += 0.8 + s.r; s.x += Math.sin(s.d) * 0.5;
        if (s.y > canvas.height) s.y = -10;
    });

    draw();
    if (gameActive) requestAnimationFrame(update);
}

function handleLifeLoss() {
    if (shieldTime > 0) return; // 二次保障
    lives--; updateHeartsUI();
    hitSound.currentTime = 0; hitSound.play().catch(() => {});
    if (lives <= 0) { gameActive = false; location.reload(); }
    else { player.y = canvas.height / 2; player.vy = 0; player.vx = 0; }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 雪花
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    snowflakes.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); });

    // 平台
    platforms.forEach(p => {
        let grad = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
        grad.addColorStop(0, '#a5f3fc'); grad.addColorStop(1, '#22d3ee');
        ctx.fillStyle = grad; ctx.fillRect(p.x, p.y, p.w, p.h);
    });

    // 🍎 繪製蘋果
    apples.forEach(a => {
        ctx.fillStyle = "#ff4d4d"; // 蘋果紅
        ctx.beginPath(); ctx.arc(a.x + 10, a.y + 10, 8, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#4ade80"; // 葉子綠
        ctx.fillRect(a.x + 8, a.y, 4, 4);
    });

    // 冰錐
    ceilingIcicles.forEach(ic => {
        let drawY = ic.isDropping ? ic.y : 0;
        let centerX = ic.x + ic.w / 2;
        ctx.fillStyle = `rgba(180, 230, 255, ${ic.opacity})`;
        ctx.beginPath();
        ctx.moveTo(ic.x, drawY); ctx.lineTo(centerX, drawY + ic.h); ctx.lineTo(ic.x + ic.w, drawY); ctx.fill();
    });

    // ⛄ 雪人主角
    drawSnowman(player.x + player.w/2, player.y);
    
    // 🛡️ 繪製護盾特效
    if (shieldTime > 0) {
        ctx.strokeStyle = `rgba(255, 215, 0, ${0.3 + Math.sin(Date.now()/100)*0.2})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(player.x + player.w/2, player.y + 30, 45, 0, Math.PI*2);
        ctx.stroke();
    }
}

function drawSnowman(x, y) {
    const headRadius = 20, bodyRadius = 22, baseRadius = 26;
    ctx.fillStyle = "white";
    ctx.beginPath(); ctx.arc(x, y + 55, baseRadius, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x, y + 35, bodyRadius, 0, Math.PI * 2); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y + 10, headRadius, 0, Math.PI * 2); ctx.clip();
    if (playerImg) ctx.drawImage(playerImg, x - headRadius, y + 10 - headRadius, headRadius * 2, headRadius * 2);
    else { ctx.fillStyle = "#ddd"; ctx.fill(); }
    ctx.restore();
    ctx.strokeStyle = "rgba(255,255,255,0.8)";
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y + 10, headRadius, 0, Math.PI * 2); ctx.stroke();
}

function updateHeartsUI() {
    heartsContainer.innerHTML = '';
    for (let i = 0; i < maxLives; i++) {
        const heart = document.createElement('canvas');
        heart.width = 30; heart.height = 30;
        const hCtx = heart.getContext('2d');
        drawWhiteHeart(hCtx, 15, 15, 10, i < lives);
        heartsContainer.appendChild(heart);
    }
}

function drawWhiteHeart(ctx, x, y, size, isFull) {
    ctx.save(); ctx.translate(x, y - size/4); ctx.beginPath();
    const r = size / 2;
    ctx.arc(-r / 2, 0, r / 2, Math.PI, 0); ctx.arc(r / 2, 0, r / 2, Math.PI, 0); ctx.lineTo(0, r * 1.2); ctx.closePath();
    if (isFull) { ctx.fillStyle = "white"; ctx.fill(); }
    else { ctx.strokeStyle = "rgba(255, 255, 255, 0.4)"; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.restore();
}

function spawnPlatform(yPos) {
    const pWidth = 80 + Math.random() * 80;
    const px = Math.random()*(canvas.width - pWidth);
    const py = yPos || canvas.height;
    platforms.push({ x: px, y: py, w: pWidth, h: 15 });
    
    // 🍎 隨機在平台上放蘋果 (20% 機率)
    if (Math.random() < 0.2) {
        apples.push({ x: px + pWidth/2 - 10, y: py - 25 });
    }
}

function initCeiling() {
    ceilingIcicles = [];
    for(let i=0; i<canvas.width; i+=25) {
        ceilingIcicles.push({ x: i, w: 15+Math.random()*15, h: 25+Math.random()*45, isDropping: false, opacity: 0.5+Math.random()*0.4 });
    }
}

function initSnow() {
    snowflakes = [];
    for(let i=0; i<60; i++) snowflakes.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5+0.5, d: Math.random()*1 });
}

setupCamera();
</script>
</body>
</html>
