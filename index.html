<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Benny's Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; background: linear-gradient(to bottom, #2c3e50, #000000); margin: 0 auto; }
        #ui { position: absolute; top: 20px; left: 20px; color: white; font-size: 16px; pointer-events: none; text-shadow: 1px 1px 3px #000; z-index: 10; display: none; }
        
        /* 毛玻璃按鈕樣式 */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; }
        #startBtn { 
            padding: 12px 30px; 
            font-size: 18px; 
            cursor: pointer; 
            background: rgba(255, 255, 255, 0.1); 
            color: white; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            backdrop-filter: blur(10px); /* 毛玻璃核心 */
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
        }
        #startBtn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }
        #deathScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; display: none; z-index: 30; }
    </style>
</head>
<body>

    <div id="ui">Lives: <span id="lives">3</span> | Score: <span id="score">0</span></div>
    
    <div id="overlay">
        <h2 style="color: white; margin-bottom: 20px; font-weight: 300; letter-spacing: 1px;">Benny's Game</h2>
        <button id="startBtn">START GAME</button>
    </div>

    <div id="deathScreen"></div>
    <canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const deathScreen = document.getElementById('deathScreen');

// 載入主角圖片
const playerImg = new Image();
playerImg.src = 'your_face.jpg'; 

// 遊戲參數
let lives, score, gameActive, currentPlatformSpeed;
let platforms = [], icicles = [], snowflakes = [];
let lastIcicleTime = 0;
const icicleInterval = 2500; 

const gravity = 0.5;
const baseWalkSpeed = 5;
const fallMultiplier = 0.8;
let keys = {};
let touchStartX = 0;

const player = { x: 0, y: 0, w: 35, h: 35, vx: 0, vy: 0, grounded: false };

// 初始化雪花
function initSnow() {
    snowflakes = [];
    for(let i=0; i<50; i++) {
        snowflakes.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 3 + 1,
            d: Math.random() * 1
        });
    }
}

function resetGame() {
    lives = 3; score = 0; currentPlatformSpeed = 1.6;
    gameActive = true; platforms = []; icicles = [];
    lastIcicleTime = Date.now();
    
    canvas.width = window.innerWidth > 500 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
    
    player.x = canvas.width / 2 - 17;
    player.y = canvas.height / 2;
    player.vy = 0; player.vx = 0;
    
    for(let i=0; i<6; i++) spawnPlatform(canvas.height / 6 * i + 200);
    
    document.getElementById('lives').innerText = lives;
    document.getElementById('score').innerText = score;
    ui.style.display = 'block';
    overlay.style.display = 'none';
    deathScreen.style.display = 'none';
    
    initSnow();
    requestAnimationFrame(update);
}

function spawnPlatform(yPos) {
    const pWidth = Math.random() * 110 + 70;
    platforms.push({ x: Math.random() * (canvas.width - pWidth), y: yPos || canvas.height, w: pWidth, h: 12 });
}

function spawnIcicle() {
    icicles.push({
        x: Math.random() * (canvas.width - 20),
        y: 20,
        w: Math.random() * 10 + 10, // 隨機寬度
        len: Math.random() * 30 + 20, // 隨機長度
        speed: 3 + Math.random() * 3
    });
}

// 控制邏輯
startBtn.addEventListener('click', resetGame);
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
window.addEventListener('touchmove', e => {
    const diff = e.touches[0].clientX - touchStartX;
    player.vx = diff > 0 ? baseWalkSpeed : -baseWalkSpeed;
    e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', () => player.vx = 0);

function update() {
    if (!gameActive) return;
    currentPlatformSpeed += 0.0004;

    // 移動
    let moveSpeed = player.grounded ? baseWalkSpeed : baseWalkSpeed * fallMultiplier;
    if (keys['ArrowLeft']) player.vx = -moveSpeed;
    else if (keys['ArrowRight']) player.vx = moveSpeed;
    else if (!('ontouchstart' in window)) player.vx *= 0.7;

    player.vy += gravity;
    player.y += player.vy;
    player.x += player.vx;
    if (player.x < 0) player.x = 0;
    if (player.x + player.w > canvas.width) player.x = canvas.width - player.w;

    // 平台碰撞
    player.grounded = false;
    platforms.forEach((p, i) => {
        p.y -= currentPlatformSpeed;
        if (player.vy > 0 && player.x < p.x + p.w && player.x + player.w > p.x &&
            player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy) {
            player.y = p.y - player.h; player.vy = 0; player.grounded = true;
        }
        if (p.y < -20) { platforms.splice(i, 1); spawnPlatform(); score++; document.getElementById('score').innerText = score; }
    });

    // 雪花飄落
    snowflakes.forEach(s => {
        s.y += Math.cos(s.d) + 1 + s.r/2;
        s.x += Math.sin(s.d) * 1;
        if (s.y > canvas.height) s.y = -10, s.x = Math.random() * canvas.width;
    });

    // 冰錐邏輯
    if (Date.now() - lastIcicleTime > icicleInterval) { spawnIcicle(); lastIcicleTime = Date.now(); }
    icicles.forEach((ic, index) => {
        ic.y += ic.speed;
        if (ic.x < player.x + player.w && ic.x + ic.w > player.x && ic.y < player.y + player.h && ic.y + ic.len > player.y) {
            icicles.splice(index, 1); handleLifeLoss();
        }
        if (ic.y > canvas.height) icicles.splice(index, 1);
    });

    if (player.y <= 20 || player.y > canvas.height) handleLifeLoss();

    draw();
    if (gameActive) requestAnimationFrame(update);
}

function handleLifeLoss() {
    lives--;
    document.getElementById('lives').innerText = lives;
    if (lives <= 0) { gameActive = false; showDeathEffect(); }
    else { player.y = canvas.height / 2; player.vy = 0; }
}

function showDeathEffect() {
    deathScreen.style.display = 'block';
    setTimeout(() => { deathScreen.style.display = 'none'; overlay.style.display = 'flex'; ui.style.display = 'none'; }, 1000);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 繪製雪花
    ctx.fillStyle = "white";
    snowflakes.forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fill();
    });

    // 頂部固定尖刺
    ctx.fillStyle = "#e74c3c";
    for(let i=0; i<canvas.width; i+=20) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i+10, 20); ctx.lineTo(i+20, 0); ctx.fill();
    }

    // 平台
    ctx.fillStyle = "rgba(236, 240, 241, 0.8)";
    platforms.forEach(p => ctx.fillRect(p.x, p.y, p.w, p.h));

    // 隨機長度冰錐
    ctx.fillStyle = "#bdc3c7";
    icicles.forEach(ic => {
        ctx.beginPath();
        ctx.moveTo(ic.x, ic.y);
        ctx.lineTo(ic.x + ic.w/2, ic.y + ic.len);
        ctx.lineTo(ic.x + ic.w, ic.y);
        ctx.fill();
    });

    // 主角圖片
    try {
        ctx.drawImage(playerImg, player.x, player.y, player.w, player.h);
    } catch(e) {
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(player.x, player.y, player.w, player.h);
    }
}
</script>
</body>
</html>
